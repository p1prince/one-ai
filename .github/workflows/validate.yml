name: Android Validation

on:
  push:
    branches: ['foundation/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - name: Compile and run unit tests (no APK)
        # The :app tasks are named per flavor (D9): core is the Core app, capabilities holds the isolated capability code.
        # compileCoreDebugAndroidTestKotlin only compiles the emulator tests (Stage 11 scaffolding); it packages nothing.
        run: gradle --no-daemon testDebugUnitTest lintDebug :app:testCoreDebugUnitTest :app:testCapabilitiesDebugUnitTest :app:lintCoreDebug :app:lintCapabilitiesDebug :app:compileCoreDebugAndroidTestKotlin :reference-plugins:app-control:testDebugUnitTest :reference-plugins:app-control:lintDebug :reference-plugins:app-control:compileDebugKotlin :reference-plugins:device-control:testDebugUnitTest :reference-plugins:device-control:lintDebug :reference-plugins:device-control:compileDebugKotlin
